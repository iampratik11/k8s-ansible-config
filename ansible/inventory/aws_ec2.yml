plugin: amazon.aws.aws_ec2

regions:
  - us-east-2

filters:
  instance-state-name:
    - running

include_filters:
  - tag:eks:nodegroup:
      - microservices-eks-nodes

hostnames:
  - instance-id

compose:
  ansible_host: instance_id
  ansible_connection: "'amazon.aws.aws_ssm'"
  ansible_aws_ssm_region: "'us-east-2'"
  ansible_aws_ssm_bucket_name: "'microservices-eks-ansible-806997204926'"
  ansible_aws_ssm_s3_addressing_style: "'virtual'"
